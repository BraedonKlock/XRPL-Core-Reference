      content="Explore the C++ internals of rippled, the XRP Ledger's core server implementation. An unofficial, independently maintained reference to XRPLF/rippled."

    <meta name="color-scheme" content="light dark" />

    <title>XRPLD C++ Reference</title>
    <script>
      try {
        const storedTheme = localStorage.getItem('xcr-theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isStored = storedTheme === 'light' || storedTheme === 'dark';
        document.documentElement.dataset.theme = isStored ? storedTheme : prefersDark ? 'dark' : 'light';
      } catch {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
